name: Set up toolchain
description: >-
  Installs pnpm (version from the packageManager field in package.json),
  Node.js (version from .node-version) with the pnpm store cache, and the
  workspace dependencies. The calling job checks out the repository first.

runs:
  using: composite
  steps:
    # Must run before setup-node: its pnpm cache needs the pnpm binary.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
