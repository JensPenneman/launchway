name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create tags and GitHub releases, push the release branch
      pull-requests: write # open and update the release pull request
    # Job-level, so a running image build below does not hold back the next
    # update of the release pull request.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # A release created with RELEASE_PLEASE_TOKEN starts the Images workflow
      # through its release event.
      release_event: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN start no workflows, so CI would never run on
          # the release pull request. A GitHub App or fine-grained token in RELEASE_PLEASE_TOKEN
          # (contents and pull requests: write) fixes that; see CONTRIBUTING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # the release images are published from here instead of from a release event.
  # Releases are normally published with scripts/release.sh, whose release
  # event starts the Images workflow; this covers a release pull request that
  # was merged on GitHub.
  images:
    name: Images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.release_event != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
