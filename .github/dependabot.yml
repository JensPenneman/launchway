version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    # pnpm 11 rejects versions younger than its minimumReleaseAge (one day by
    # default), also in frozen-lockfile installs, so wait a little longer.
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore(deps)
    groups:
      # Minor and patch updates of every package in one pull request; each
      # major update gets a pull request of its own.
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node.js types follow the runtime major pinned in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to 5.x until openapi-typescript supports TypeScript 7 (ADR 0008).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; composite actions need their own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # The Node.js major follows .node-version and is upgraded deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A PostgreSQL major upgrade needs pg_upgrade or a dump and restore of
      # existing installations, so it is never proposed automatically.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
