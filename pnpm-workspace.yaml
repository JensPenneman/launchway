packages:
  - apps/*
  - packages/*

# pnpm 11 reads its settings from this file; .npmrc only carries registry/auth settings.
saveExact: true
strictPeerDependencies: true
engineStrict: true
preferWorkspacePackages: true

# Versions shared by several workspace packages. Reference them with "catalog:".
catalog:
  '@types/node': 24.19.1
  '@types/ws': 8.18.2
  pino: 10.4.0
  pino-pretty: 13.2.0
  tsx: 4.23.15
  typescript: 5.9.3
  vitest: 5.0.3
  ws: 8.22.0
  zod: 4.6.5

# pnpm 11 holds back versions younger than minimumReleaseAge (supply-chain protection).
# Entries here were deliberately accepted before reaching that age.
minimumReleaseAgeExclude:
  - knip@6.40.0
  - vite@8.3.3

# Dependency install scripts are denied unless listed with `true`.
allowBuilds:
  # Verifies the platform binary used by tsx, drizzle-kit and Vite tooling.
  esbuild: true
  # Git hooks are installed by the root `prepare` script instead.
  lefthook: false
  # Optional native SSH acceleration and postinstall notices pulled in by Testcontainers.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # argon2 ships N-API prebuilds (linux glibc/musl x64+arm64, darwin-arm64); no compile needed.
  argon2: false
