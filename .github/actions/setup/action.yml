name: Set up toolchain
description: >-
  Installs pnpm (version from the packageManager field in package.json),
  Node.js (version from .node-version) with the pnpm store cache, and the
  workspace dependencies. The calling job checks out the repository first.

runs:
  using: composite
  steps:
    # Must run before setup-node: its pnpm cache needs the pnpm binary.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
