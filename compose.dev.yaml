# Services for local development only (production: deploy/compose.yaml).
#   docker compose -f compose.dev.yaml up -d
name: launchway-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: launchway
      POSTGRES_PASSWORD: launchway
      POSTGRES_DB: launchway
    ports:
      - '127.0.0.1:${LAUNCHWAY_DEV_DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U launchway -d launchway']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
