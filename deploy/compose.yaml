# Slipway control plane: the API with the web UI, the bundled node agent, the
# Caddy edge proxy and PostgreSQL.
#
# deploy/install.sh (Linux, macOS) and deploy/install.ps1 (Windows with Docker
# Desktop) copy this file and the Caddyfile into the installation directory,
# generate the .env next to them (see .env.example) and start the stack. The
# installer replaces this file on every run: put local changes in
# compose.override.yaml next to it.
#
# The external network is created by the installer:
#   docker network create --subnet 10.210.0.0/24 --ip-range 10.210.0.128/25 slipway-proxy
# (--ip-range keeps dynamic addresses away from Caddy's fixed 10.210.0.2.)
#
# Upgrade, from the installation directory:
#   docker compose pull && docker compose up -d --wait

name: slipway

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  slipway:
    image: ghcr.io/jenspenneman/slipway:${SLIPWAY_VERSION:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://slipway:${POSTGRES_PASSWORD:-}@db:5432/slipway
      SLIPWAY_SECRET_KEY: ${SLIPWAY_SECRET_KEY:-}
      SLIPWAY_LISTEN: 0.0.0.0:3000
      SLIPWAY_PUBLIC_URL: ${SLIPWAY_PUBLIC_URL:-}
      SLIPWAY_CADDY_ADMIN_URL: unix:///run/caddy-admin/admin.sock
      SLIPWAY_PROXY_NETWORK: slipway-proxy
      # Only Caddy (fixed address) may set X-Forwarded-*: app containers share this network.
      SLIPWAY_TRUSTED_PROXIES: 10.210.0.2/32
      SLIPWAY_ACME_EMAIL: ${SLIPWAY_ACME_EMAIL:-}
      SLIPWAY_LOCAL_JOIN_TOKEN: ${SLIPWAY_LOCAL_JOIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Direct access, so the first-run setup works before any domain exists.
      - "${SLIPWAY_PORT:-3000}:3000"
    volumes:
      - caddy-admin:/run/caddy-admin
    networks:
      - slipway-proxy
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging: *logging

  slipway-agent:
    image: ghcr.io/jenspenneman/slipway-agent:${SLIPWAY_VERSION:-latest}
    restart: unless-stopped
    init: true
    # Runs as root and keeps a writable root filesystem: it owns the Docker
    # socket and drives the docker and git CLIs.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SLIPWAY_SERVER_URL: ws://slipway:3000
      SLIPWAY_JOIN_TOKEN: ${SLIPWAY_LOCAL_JOIN_TOKEN:-}
      SLIPWAY_WORKSPACE: /var/lib/slipway
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/var/lib/slipway
    networks:
      - slipway-proxy
    depends_on:
      slipway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # --resume starts from the configuration the API loaded last (autosaved in
    # the caddy-config volume); the Caddyfile only bootstraps the first start.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--resume"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SLIPWAY_ACME_EMAIL: ${SLIPWAY_ACME_EMAIL:-}
    # The admin API is a unix socket in the caddy-admin volume (see the Caddyfile).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      # Upstream for routes to services on the host itself. Docker Desktop
      # provides this name already; on Linux it needs this entry.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/run/caddy-admin
    networks:
      slipway-proxy:
        ipv4_address: 10.210.0.2
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/caddy-admin/admin.sock"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # The entrypoint needs these to prepare the data directory and to switch to
    # the postgres user; everything else is dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: slipway
      POSTGRES_DB: slipway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # The postgres 18 image keeps PGDATA in /var/lib/postgresql/18/docker:
      # mount the parent directory, not .../data.
      - db-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      # Checked over TCP: during the first initialisation the image runs a
      # temporary socket-only server that must not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "slipway", "-d", "slipway"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging: *logging

networks:
  slipway-proxy:
    name: slipway-proxy
    external: true
  database:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # Caddy's admin socket; mounted only into caddy and slipway.
  caddy-admin:
  agent-data:
